worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # NPM owns HTTPS and the public authority. Directory redirects stay relative,
        # so they never expose the container's HTTP scheme or internal port.
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";

        error_page 404 /404.html;

        # Exported routes are directories (e.g. /de/index.html).
        # Unknown paths return a real 404 instead of the homepage.
        location / {
            try_files $uri $uri/ =404;
        }

        location = /404.html {
            internal;
        }

        # Content-hashed Next.js assets can safely be cached between releases.
        location /_next/static/ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ /\. {
            deny all;
        }
    }
}
